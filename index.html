<!DOCTYPE html>
<html>
    <head>
        <title>Duck Hunt</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div id="game-container">
            <div id="main-menu" class="screen active">
                <h1>Duck Hunt</h1>
                <button id="btn-start">Start Game</button>
            </div>
            
            <div id="duck-layer" class="screen"></div>
            <div id="crosshair"></div>
            <div id="hud" class="screen">Score: <span id="score-display">0</span></div>            

            <div id="pause-screen" class="screen">
                <h2>Paused</h2>
                <button id="btn-resume">Resume</button>
                <button id="btn-restart">Restart</button>
                <button id="btn-pause-mainmenu">Main Menu</button>
            </div>
        </div>

        <script src="js/input.js"></script>
        <script src="js/crosshair.js"></script>
        <script src="js/duck.js"></script>
        <script src="js/collision.js"></script>
        <script src="js/state.js"></script>
        <script src="js/game.js"></script>
    </body>
</html>
